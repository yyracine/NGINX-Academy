<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nginx Academy — Apprendre NGINX de A à Z</title>
<meta name="description" content="Cours interactif progressif pour maîtriser NGINX : leçons, exercices, quiz et projets d'évaluation. Installable en PWA.">
<meta name="theme-color" content="#0b1420">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <!-- Barre supérieure -->
  <header class="topbar">
    <button id="btn-menu" class="icon-btn" aria-label="Menu" title="Menu">☰</button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">N</span>
      <div class="brand-txt">
        <strong>Nginx Academy</strong>
        <span class="brand-sub">Maîtrisez NGINX, pas à pas</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="offline-dot" id="offline-dot" title="Hors ligne">●</span>
      <div class="progress-mini" title="Progression globale">
        <div class="progress-mini-bar" id="progress-mini-bar"></div>
      </div>
      <span class="progress-mini-pct mono" id="progress-mini-pct">0&nbsp;%</span>
      <button id="btn-install" class="btn btn-ghost hidden">Installer l'app</button>
    </div>
  </header>

  <div class="layout">
    <!-- Navigation modules -->
    <nav class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar-head">
        <span>Modules</span>
        <span class="mono sidebar-count" id="sidebar-count"></span>
      </div>
      <ul id="module-nav" class="module-nav"></ul>
      <footer class="sidebar-foot">
        <button class="btn btn-ghost btn-block" id="btn-reset">Réinitialiser ma progression</button>
      </footer>
    </nav>

    <!-- Contenu principal -->
    <main class="main" id="main"></main>
  </div>
</div>

<!-- Modale (confirmation, installation, projet) -->
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="icon-btn modal-close" id="modal-close" aria-label="Fermer">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast hidden" id="toast" role="status"></div>

<script src="js/md.js"></script>
<script src="js/nginx-lint.js"></script>
<script src="js/sandbox.js"></script>
<script src="js/quiz.js"></script>
<script src="js/data.js"></script>
<script src="js/data1.js"></script>
<script src="js/data1b.js"></script>
<script src="js/data2.js"></script>
<script src="js/data3.js"></script>
<script src="js/data4.js"></script>
<script src="js/data5.js"></script>
<script src="js/data6.js"></script>
<script src="js/data7.js"></script>
<script src="js/data8.js"></script>
<script src="js/data9.js"></script>
<script src="js/data10.js"></script>
<script src="js/guide.js"></script>
<script src="js/lexique.js"></script>
<script src="js/correction.js"></script>
<script src="js/app.js"></script>
</body>
</html>
